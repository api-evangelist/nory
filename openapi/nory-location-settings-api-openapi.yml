openapi: 3.2.0
info:
  title: Nory Middleware - Sandbox Environment Location Settings API
  version: 1.0.0
  description: Nory
servers:
- https://sandbox.nory.ai
- http://localhost:8000
tags:
- name: Location Settings
paths:
  /settings/customHolidays/{id}:
    get:
      tags:
      - Location Settings
      name: Get custom holidays by ID
      summary: Get custom holidays for a location
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Requested data
        '401':
          description: Permission error
        '500':
          description: Internal server error
      operationId: getSettingsCustomHolidaysById
      x-operation-id-source: derived
    post:
      tags:
      - Location Settings
      name: Create custom holidays for a location by ID
      summary: Create custom holidays for a location by ID
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Requested data
        '400':
          description: Bad request
        '401':
          description: Permission error
        '500':
          description: Internal server error
      requestBody:
        content:
          application/json:
            schema: {}
      operationId: postSettingsCustomHolidaysById
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      name: Authorization
      scheme: bearer
      in: header
