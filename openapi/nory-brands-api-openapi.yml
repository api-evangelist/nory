openapi: 3.2.0
info:
  title: Nory Middleware - Sandbox Environment Brands API
  version: 1.0.0
  description: Nory
servers:
- https://sandbox.nory.ai
- http://localhost:8000
tags:
- name: Brands
paths:
  /brands/brand:
    get:
      tags:
      - Brands
      name: Get Brand
      summary: Get Brand associated with the User
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: brandname
        schema:
          type: string
        required:
        - name
      responses:
        '200':
          description: A single brand object
        '401':
          description: No auth token
        '403':
          description: JWT token and username from client don't match
      operationId: getBrandsBrand
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      name: Authorization
      scheme: bearer
      in: header
