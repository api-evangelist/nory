openapi: 3.2.0
info:
  title: Nory Middleware - Sandbox Environment Templates API
  version: 1.0.0
  description: Nory
servers:
- https://sandbox.nory.ai
- http://localhost:8000
tags:
- name: Templates
paths:
  /templates/{id}:
    get:
      tags:
      - Templates
      name: Get Templates
      summary: Get Templates for the branch
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Requested data
        '400':
          description: Bad request
        '401':
          description: Permission error
        '500':
          description: Internal server error
      operationId: getTemplatesById
      x-operation-id-source: derived
  /templates/:
    post:
      tags:
      - Templates
      name: Create Template
      summary: Create Template for the branch
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Requested data
        '400':
          description: Bad request
        '401':
          description: Permission error
        '500':
          description: Internal server error
      requestBody:
        content:
          application/json:
            schema: {}
      operationId: postTemplates
      x-operation-id-source: derived
  /templates/{templateId}:
    delete:
      tags:
      - Templates
      name: Delete Template
      summary: Delete Template
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: templateId
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Action successful
        '400':
          description: Bad request
        '401':
          description: Permission error
        '500':
          description: Internal server error
      operationId: deleteTemplatesByTemplateId
      x-operation-id-source: derived
  /templates/apply:
    post:
      tags:
      - Templates
      name: Apply Template
      summary: Apply Template
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Requested data
        '400':
          description: Bad request
        '401':
          description: Permission error
        '500':
          description: Internal server error
      requestBody:
        content:
          application/json:
            schema: {}
      operationId: postTemplatesApply
      x-operation-id-source: derived
  /templates/recommendation:
    post:
      tags:
      - Templates
      name: Request Template Recommendation
      summary: Request Template Recommendation
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '204':
          description: Requested data
        '400':
          description: Bad request
        '401':
          description: Permission error
        '500':
          description: Internal server error
      requestBody:
        content:
          application/json:
            schema: {}
      operationId: postTemplatesRecommendation
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      name: Authorization
      scheme: bearer
      in: header
