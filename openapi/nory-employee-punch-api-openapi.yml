openapi: 3.2.0
info:
  title: Nory Middleware - Sandbox Environment Employee Punch API
  version: 1.0.0
  description: Nory
servers:
- https://sandbox.nory.ai
- http://localhost:8000
tags:
- name: Employee Punch
paths:
  /punch/{id}:
    get:
      tags:
      - Employee Punch
      name: Get Punch by ID
      summary: Get Punch data
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Requested data
        '401':
          description: Permission error
        '500':
          description: Internal server error
      operationId: getPunchById
      x-operation-id-source: derived
  /punch:
    get:
      tags:
      - Employee Punch
      name: Get Punch Data for Employee
      summary: Get Data from Labour service - Employee Punch information
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: employee_id
        schema:
          type: string
        required:
        - name
      - in: query
        name: limit
        schema:
          type: number
        required:
        - name
      responses:
        '200':
          description: Requested data
        '401':
          description: Permission error
        '500':
          description: Internal server error
      operationId: getPunch
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      name: Authorization
      scheme: bearer
      in: header
