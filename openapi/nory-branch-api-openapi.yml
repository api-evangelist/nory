openapi: 3.2.0
info:
  title: Nory Middleware - Sandbox Environment Branch API
  version: 1.0.0
  description: Nory
servers:
- https://sandbox.nory.ai
- http://localhost:8000
tags:
- name: Branch
paths:
  /branches/{id}:
    get:
      tags:
      - Branch
      name: Get Branch
      summary: Get Branch associated with the User
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: A single branch object
        '401':
          description: No auth token
        '403':
          description: JWT token invalid
      operationId: getBranchesById
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      name: Authorization
      scheme: bearer
      in: header
