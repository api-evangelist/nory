aid: nory
name: Nory
description: >-
  Nory is an AI-powered restaurant management platform (an "agentic AI
  restaurant operating system") founded in Ireland in 2019 by Conor Sheridan.
  It unifies business intelligence, inventory, workforce scheduling and payroll
  into one control centre, using real-time data and predictive AI (demand-based
  ordering, live P&L, labour forecasting) to cut food waste and labour cost
  across single-site and multi-location restaurant groups. Nory connects to POS
  and hospitality systems such as Toast, Lightspeed, Square, SumUp, Vita Mojo,
  Clover, Zonal, Revel, Oracle Micros and Shift4, and exposes a partner-facing
  Middleware API (published as a Swagger 2.0 sandbox definition) covering
  brands, branches, inventory counts/deliveries/suppliers, AI recommended
  purchase orders, employee punch/labour data, location settings and scheduling
  templates. Nory raised a $37M Series B in 2025 and is backed by Accel.
